# Reviewed bounded verification attempt. C remains an explicit assumption.
name: Conditional geometry replay (C remains an assumption)
'on':
  push:
    branches: ['verify/conditional-geometry-20261016']
permissions:
  contents: read
concurrency:
  group: conditional-geometry-${{ github.ref }}
  cancel-in-progress: false
jobs:
  conditional-replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install official Ubuntu sandbox dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y bubblewrap zstd
      - name: Replay the conditional source union with C explicit
        run: >-
          python3 -I -B ci/cache_diagnostic.py
          --contract-sha256 4faee6e1fc9d7bfae73527908ad432a64fe3190f505acc9b6304c5ac809a79ff
          --work "${{ runner.temp }}/conditional-geometry"
      - name: Preserve bounded conditional evidence
        if: ${{ always() }}
        timeout-minutes: 2
        run: >-
          python3 -I -B ci/collect_evidence.py
          --work "${{ runner.temp }}/conditional-geometry"
      - name: Upload evidence only, with C still explicit
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conditional-C-explicit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/conditional-geometry/upload/**
          retention-days: 7
          if-no-files-found: error
