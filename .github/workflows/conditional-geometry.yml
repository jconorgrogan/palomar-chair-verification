name: Higher dimensions three and at least five
'on':
  push:
    branches: ['verify/higher-h5-read-diagnostic-20261018']
permissions:
  contents: read
  actions: read
concurrency:
  group: higher-dimensions-${{ github.ref }}
  cancel-in-progress: false
jobs:
  H5_higher_assembly:
    name: conditional H5_higher_assembly
    if: ${{ true }}
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - name: Check out the exact staged candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install official Ubuntu sandbox dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y bubblewrap zstd
      - name: Replay this exact checked-object stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -I -B ci/cache_diagnostic.py
          --contract-sha256 aa6ae7a64d5e8b00e358887ad5d085127b1e318bd8b291ef7ba8ac59886c9369
          --stage H5_higher_assembly
          --work "${{ runner.temp }}/conditional-geometry"
      - name: Preserve bounded stage evidence
        if: ${{ always() }}
        timeout-minutes: 2
        run: >-
          python3 -I -B ci/collect_evidence.py
          --work "${{ runner.temp }}/conditional-geometry"
      - name: Upload complete checked stage objects
        id: upload_objects
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conditional-geometry-${{ github.run_id }}-${{ github.run_attempt }}-H5_higher_assembly-objects
          path: ${{ runner.temp }}/conditional-geometry/object-upload/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Bind checked objects to this successful producer job
        run: |
          printf '%s\n' 'CONDITIONAL_STAGE_ARTIFACT_V1 {"stage_id":"H5_higher_assembly","artifact_id":"${{ steps.upload_objects.outputs.artifact-id }}","artifact_sha256":"${{ steps.upload_objects.outputs.artifact-digest }}","artifact_name":"conditional-geometry-${{ github.run_id }}-${{ github.run_attempt }}-H5_higher_assembly-objects"}'
      - name: Upload bounded diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conditional-evidence-${{ github.run_id }}-${{ github.run_attempt }}-H5_higher_assembly
          path: ${{ runner.temp }}/conditional-geometry/upload/**
          retention-days: 7
          if-no-files-found: error
