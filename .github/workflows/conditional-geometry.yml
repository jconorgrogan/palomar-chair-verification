name: Higher dimensions three and at least five
'on':
  push:
    branches: ['verify/higher-dimensions-20261016']
permissions:
  contents: read
  actions: read
concurrency:
  group: higher-dimensions-${{ github.ref }}
  cancel-in-progress: false
jobs:
  H0_common:
    name: conditional H0_common
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - name: Check out the exact staged candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install official Ubuntu sandbox dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y bubblewrap zstd
      - name: Replay this exact checked-object stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -I -B ci/cache_diagnostic.py
          --contract-sha256 ab2160e3cb05b271cff0b396d235186e25faf94d4781ae2e4ad0d83ed7415411
          --stage H0_common
          --work "${{ runner.temp }}/conditional-geometry"
      - name: Preserve bounded stage evidence
        if: ${{ always() }}
        timeout-minutes: 2
        run: >-
          python3 -I -B ci/collect_evidence.py
          --work "${{ runner.temp }}/conditional-geometry"
      - name: Upload complete checked stage objects
        id: upload_objects
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conditional-geometry-${{ github.run_id }}-${{ github.run_attempt }}-H0_common-objects
          path: ${{ runner.temp }}/conditional-geometry/object-upload/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Bind checked objects to this successful producer job
        run: |
          printf '%s\n' 'CONDITIONAL_STAGE_ARTIFACT_V1 {"stage_id":"H0_common","artifact_id":"${{ steps.upload_objects.outputs.artifact-id }}","artifact_sha256":"${{ steps.upload_objects.outputs.artifact-digest }}","artifact_name":"conditional-geometry-${{ github.run_id }}-${{ github.run_attempt }}-H0_common-objects"}'
      - name: Upload bounded diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conditional-evidence-${{ github.run_id }}-${{ github.run_attempt }}-H0_common
          path: ${{ runner.temp }}/conditional-geometry/upload/**
          retention-days: 7
          if-no-files-found: error
