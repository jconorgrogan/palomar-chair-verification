# Exact recovery activation. Publication requires the independent integrated-tree seal.
name: Verify hierarchy C clean recovery
'on':
  push:
    branches:
    - verify/hierarchy-c-clean-recovery-20261018
    paths:
    - ci/**
    - .github/workflows/hierarchy-c-clean-recovery.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: hierarchy-c-clean-recovery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
    - name: Check out reviewed pipeline commit
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        path: pipeline
        persist-credentials: false
        fetch-depth: 1
    - name: Check out immutable source snapshot
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 5d0612a09e3b7d440be16e7b1dc511ae73035bbb
        path: source
        persist-credentials: false
        fetch-depth: 1
    - name: Verify exact clean checkout identities
      id: checkout_guard
      run: "set -euo pipefail\nverify_checkout() {\n  test \"$(/usr/bin/git -C \"$GITHUB_WORKSPACE/$1\" rev-parse HEAD)\"\
        \ = \"$2\"\n  test -z \"$(/usr/bin/git -C \"$GITHUB_WORKSPACE/$1\" status --porcelain=v1 --untracked-files=all --ignored=matching)\"\
        \n}\nverify_checkout pipeline \"$GITHUB_SHA\"\nverify_checkout source 5d0612a09e3b7d440be16e7b1dc511ae73035bbb\n"
    - name: Install official Ubuntu archive and sandbox dependencies
      run: 'sudo apt-get update -qq

        sudo apt-get install --no-install-recommends -y bubblewrap zstd

        '
    - name: Run fail-closed verifier
      env:
        GH_TOKEN: ${{ github.token }}
        PYTHONDONTWRITEBYTECODE: '1'
      run: /usr/bin/timeout --signal=TERM --kill-after=30s 19800s /usr/bin/python3 -I -S -B "$GITHUB_WORKSPACE/pipeline/ci/clean_driver.py"
        prepare --contract-sha256 0801e0048b3afee7b1249384372a9f1308a27519129e4764557fdd068899c4e7 --pipeline "$GITHUB_WORKSPACE/pipeline" --source "$GITHUB_WORKSPACE/source"
    - name: Upload only this job's new evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
        name: hierarchy-c-${{ github.run_id }}-${{ github.run_attempt }}-prepare
        path: ${{ runner.temp }}/hierarchy-c-clean-prepare/upload/*
    - name: Upload bounded incomplete diagnostics
      if: ${{ (failure() || cancelled()) && steps.checkout_guard.outcome == 'success' }}
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        if-no-files-found: warn
        retention-days: 7
        compression-level: 0
        name: hierarchy-c-failure-${{ github.run_id }}-${{ github.run_attempt }}-prepare
        path: '${{ runner.temp }}/hierarchy-c-clean-prepare/failure/FAILURE.json

          ${{ runner.temp }}/hierarchy-c-clean-prepare/failure/native.stdout

          ${{ runner.temp }}/hierarchy-c-clean-prepare/failure/native.stderr

          '
    if: ${{ true }}
