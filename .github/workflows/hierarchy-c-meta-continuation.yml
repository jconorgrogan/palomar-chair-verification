# SOURCE-ONLY CANDIDATE. Requires separate publication authority and review.
# Reviewed full modern C attempt. Live evidence and all final gates remain required.
name: Continued modern hierarchy C verification (clean rebuild pending)
'on':
  push:
    branches: ['verify/hierarchy-c-meta-continuation-20261016']
    paths: ['ci/**', '.github/workflows/hierarchy-c-meta-continuation.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: hierarchy-c-meta-continuation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Check out reviewed pipeline commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: pipeline
          persist-credentials: false
          fetch-depth: 1
      - name: Check out immutable source snapshot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5d0612a09e3b7d440be16e7b1dc511ae73035bbb
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Install official Ubuntu archive and sandbox dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y bubblewrap zstd
      - name: Run fail-closed verifier
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python3 -B pipeline/ci/continuation_driver.py prepare
          --contract-sha256 8aa4d184909845f7a204840abeaa131e863cbb0b58012a735aa2cdbecf06b753
          --pipeline "$GITHUB_WORKSPACE/pipeline"
          --source "$GITHUB_WORKSPACE/source"
      - name: Upload only this job's new evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          name: hierarchy-c-${{ github.run_id }}-${{ github.run_attempt }}-prepare
          path: ${{ runner.temp }}/hierarchy-c-prepare/upload/*
    # Failure evidence is disjoint from all success artifacts and never consumed.
      - name: Collect bounded incomplete diagnostics
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 1
        continue-on-error: true
        run: >-
          python3 -B pipeline/ci/ci_failure.py prepare
      - name: Upload bounded incomplete diagnostics
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
          name: hierarchy-c-failure-${{ github.run_id }}-${{ github.run_attempt }}-prepare
          path: ${{ runner.temp }}/hierarchy-c-failure-prepare/*
