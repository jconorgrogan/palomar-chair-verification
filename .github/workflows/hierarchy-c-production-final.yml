      with:
        ref: bc3f977237bee905dafb4f13eeb6564a4a338b42
        path: latest
        persist-credentials: false
        fetch-depth: 1
    - name: Verify exact clean checkout identities
      id: checkout_guard
      run: "set -euo pipefail\nverify_checkout() {\n  test \"$(/usr/bin/git -C \"$GITHUB_WORKSPACE/$1\" rev-parse HEAD)\"\
        \ = \"$2\"\n  test -z \"$(/usr/bin/git -C \"$GITHUB_WORKSPACE/$1\" status --porcelain=v1 --untracked-files=all --ignored=matching)\"\
        \n}\nverify_checkout pipeline \"$GITHUB_SHA\"\nverify_checkout source 5d0612a09e3b7d440be16e7b1dc511ae73035bbb\nverify_checkout\
        \ prior fca406f6c52a622762d9c75167a92f895c3ddd00\nverify_checkout latest bc3f977237bee905dafb4f13eeb6564a4a338b42\n"
    - name: Install official Ubuntu archive and sandbox dependencies
