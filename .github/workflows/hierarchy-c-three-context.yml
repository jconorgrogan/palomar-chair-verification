# Reviewed continued attempt; all actual fresh stages and final verification gates remain required.
name: Verify hierarchy C with authenticated historical stages
'on':
  push:
    branches:
    - verify/hierarchy-c-three-context-20261016
    paths:
    - ci/**
    - admission/**
    - acquisition/**
    - .github/workflows/hierarchy-c-three-context.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: hierarchy-c-three-context-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
    - name: Check out reviewed pipeline commit
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.sha }}
        path: pipeline
        persist-credentials: false
        fetch-depth: 1
    - name: Check out immutable source snapshot
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: 5d0612a09e3b7d440be16e7b1dc511ae73035bbb
        path: source
        persist-credentials: false
        fetch-depth: 1
    - name: Check out immutable prior pipeline
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: fca406f6c52a622762d9c75167a92f895c3ddd00
        path: prior
        persist-credentials: false
        fetch-depth: 1
    - name: Verify exact clean checkout identities
      id: checkout_guard
      run: |
        set -euo pipefail
        verify_checkout() {
          test "$(/usr/bin/git -C "$GITHUB_WORKSPACE/$1" rev-parse HEAD)" = "$2"
          test -z "$(/usr/bin/git -C "$GITHUB_WORKSPACE/$1" status --porcelain=v1 --untracked-files=all --ignored=matching)"
        }
        verify_checkout pipeline "$GITHUB_SHA"
        verify_checkout source 5d0612a09e3b7d440be16e7b1dc511ae73035bbb
        verify_checkout prior fca406f6c52a622762d9c75167a92f895c3ddd00
    - name: Install official Ubuntu archive and sandbox dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install --no-install-recommends -y bubblewrap zstd
    - name: Run fail-closed verifier
      env:
        GH_TOKEN: ${{ github.token }}
        PYTHONDONTWRITEBYTECODE: '1'
      run: /usr/bin/timeout --signal=TERM --kill-after=30s 19800s /usr/bin/python3 -I -S -B "$GITHUB_WORKSPACE/pipeline/ci/three_context_driver.py"
        prepare --contract-sha256 58a3962123c06782e3ffd2c2b4845e7ec9f4a580f1715852af22ceb6b14606f9 --pipeline "$GITHUB_WORKSPACE/pipeline" --source "$GITHUB_WORKSPACE/source"
        --prior "$GITHUB_WORKSPACE/prior"
    - name: Upload only this job's new evidence
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
        name: hierarchy-c-${{ github.run_id }}-${{ github.run_attempt }}-prepare
        path: ${{ runner.temp }}/hierarchy-c-prepare/upload/*
    - name: Collect bounded incomplete diagnostics
      if: ${{ (failure() || cancelled()) && steps.checkout_guard.outcome == 'success' }}
      timeout-minutes: 1
      continue-on-error: true
      run: /usr/bin/python3 -I -S -B "$GITHUB_WORKSPACE/pipeline/ci/ci_failure.py" prepare
    - name: Upload bounded incomplete diagnostics
      if: ${{ failure() || cancelled() }}
      continue-on-error: true
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        if-no-files-found: warn
        retention-days: 7
        compression-level: 0
        name: hierarchy-c-failure-${{ github.run_id }}-${{ github.run_attempt }}-prepare
        path: ${{ runner.temp }}/hierarchy-c-failure-prepare/*
