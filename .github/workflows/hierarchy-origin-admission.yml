name: Admit retained hierarchy artifacts (no proof execution)
on:
  push:
    branches: [verify/hierarchy-c-origin-admission-20261016]
permissions:
  contents: read
  actions: read
concurrency:
  group: hierarchy-origin-admission-${{ github.ref }}
  cancel-in-progress: false
jobs:
  admit:
    name: Admit fixed historical artifact closure
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Checkout reviewed admission pipeline
        id: checkout_pipeline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: pipeline
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout immutable prior pipeline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fca406f6c52a622762d9c75167a92f895c3ddd00
          path: prior
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout immutable hierarchy sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 5d0612a09e3b7d440be16e7b1dc511ae73035bbb
          path: source
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact clean checkout identities
        id: checkout_guard
        run: |
          set -euo pipefail
          verify_checkout() {
            test "$(/usr/bin/git -C "$GITHUB_WORKSPACE/$1" rev-parse HEAD)" = "$2"
            test -z "$(/usr/bin/git -C "$GITHUB_WORKSPACE/$1" status --porcelain=v1 --untracked-files=all --ignored=matching)"
          }
          verify_checkout pipeline "$GITHUB_SHA"
          verify_checkout prior fca406f6c52a622762d9c75167a92f895c3ddd00
          verify_checkout source 5d0612a09e3b7d440be16e7b1dc511ae73035bbb
      - name: Install Ubuntu sandbox dependency
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Run bounded historical acquisition and native admission
        id: admission
        env:
          GH_TOKEN: ${{ github.token }}
          SPEC_SHA256: 2e96052ff06adee144b8945eb12ec9de50cd8ff63dce5f0f7cefda84d5d6c51a
        run: |
          set -euo pipefail
          /usr/bin/timeout --signal=TERM --kill-after=30s 19800s \
            /usr/bin/python3 -I -S -B "$GITHUB_WORKSPACE/pipeline/code/three_context_job.py" \
              --spec "$GITHUB_WORKSPACE/pipeline/inputs/JOB_SPEC.json" \
              --spec-sha256 "$SPEC_SHA256" \
              --workspace "$RUNNER_TEMP/hierarchy-origin-admission" \
              --prior-root "$GITHUB_WORKSPACE/prior" \
              --acquisition-root "$GITHUB_WORKSPACE/pipeline/acquisition/ci" \
              --source-package "$GITHUB_WORKSPACE/source"
      - name: Collect bounded admission evidence
        id: collect
        if: always() && steps.checkout_guard.outcome == 'success'
        run: |
          set -euo pipefail
          /usr/bin/timeout --signal=TERM --kill-after=10s 120s \
            /usr/bin/python3 -I -S -B "$GITHUB_WORKSPACE/pipeline/code/three_context_evidence.py" \
              --workspace "$RUNNER_TEMP/hierarchy-origin-admission" \
              --output "$RUNNER_TEMP/hierarchy-origin-admission-evidence"
      - name: Upload only bounded admission evidence
        id: upload
        if: always() && steps.collect.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hierarchy-native-admission-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hierarchy-origin-admission-evidence/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
      - name: Bind successful admission artifact
        if: success() && steps.admission.outcome == 'success' && steps.upload.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          SPEC_SHA256: 2e96052ff06adee144b8945eb12ec9de50cd8ff63dce5f0f7cefda84d5d6c51a
        run: |
          /usr/bin/python3 -I -S -B - <<'PY'
          import json, os, re
          aid = os.environ['ARTIFACT_ID']
          digest = os.environ['ARTIFACT_DIGEST']
          assert re.fullmatch(r'[1-9][0-9]*', aid)
          assert re.fullmatch(r'[0-9a-f]{64}', digest)
          print('HIERARCHY_NATIVE_ADMISSION_UPLOAD=' + json.dumps({
              'artifact_id': int(aid), 'artifact_sha256': digest,
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'pipeline_commit': os.environ['GITHUB_SHA'],
              'spec_sha256': os.environ['SPEC_SHA256'],
              'proof_pass_claimed': False}, sort_keys=True))
          PY
