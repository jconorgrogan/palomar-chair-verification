# Create this exact file at .github/workflows/palomar-official-repair1.yml.
# The newly created workflow runs automatically once on the designated branch.
name: Official CLARK Palomar full mechanical preflight repair 1
on:
  push:
    branches: [verification/palomar-repair1-20261006]
permissions:
  contents: read
concurrency:
  group: official-clark-palomar-repair1-20261006
  cancel-in-progress: false
jobs:
  palomar-full:
    if: >-
      github.event_name == 'push' &&
      github.run_number == 1 &&
      github.run_attempt == 1
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: jconorgrogan/palomar-chair-verification
      commit: ${{ github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: clarkfix0001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json","formalization_metadata_path":"formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
