# New five-job contract. C remains an explicit assumption.
name: Staged conditional geometry replay (C remains an assumption)
'on':
  push:
    branches: ['verify/conditional-staged-20261016']
permissions:
  contents: read
  actions: read
concurrency:
  group: conditional-staged-${{ github.ref }}
  cancel-in-progress: false
jobs:
  F0_common:
    name: conditional F0_common
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - name: Check out the exact staged candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install official Ubuntu sandbox dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y bubblewrap zstd
      - name: Replay this exact checked-object stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -I -B ci/cache_diagnostic.py
          --contract-sha256 cbba2b835ef2578ad4810068cab863918af442d5fa30abea5cafcfa78ce35a38
          --stage F0_common
          --work "${{ runner.temp }}/conditional-geometry"
      - name: Preserve bounded stage evidence
        if: ${{ always() }}
        timeout-minutes: 2
        run: >-
          python3 -I -B ci/collect_evidence.py
          --work "${{ runner.temp }}/conditional-geometry"
      - name: Upload complete checked stage objects
        id: upload_objects
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conditional-geometry-${{ github.run_id }}-${{ github.run_attempt }}-F0_common-objects
          path: ${{ runner.temp }}/conditional-geometry/object-upload/*
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Bind checked objects to this successful producer job
        run: |
          printf '%s\n' 'CONDITIONAL_STAGE_ARTIFACT_V1 {"stage_id":"F0_common","artifact_id":"${{ steps.upload_objects.outputs.artifact-id }}","artifact_sha256":"${{ steps.upload_objects.outputs.artifact-digest }}","artifact_name":"conditional-geometry-${{ github.run_id }}-${{ github.run_attempt }}-F0_common-objects"}'
      - name: Upload bounded diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: conditional-evidence-${{ github.run_id }}-${{ github.run_attempt }}-F0_common
          path: ${{ runner.temp }}/conditional-geometry/upload/**
          retention-days: 7
          if-no-files-found: error
