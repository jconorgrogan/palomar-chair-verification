automation:
  methods:
  - method: agent
    models: []
    framework: OpenAI assistant with Lean and GitHub Actions
    tool_setup: Source preparation, finite/static tests, independently checked command receipts and bounded
      CI verification. Final all-dimensional Lean and Comparator checks remain pending.
  notes: AI assistance is disclosed in the new source headers. No exact model usage, wall time or cost
    is asserted without a complete ledger.
fidelity:
  divergences: Tile choice may depend on dimension. The statement allows all Euclidean isometries, requires
    full cover and disjoint interiors, quantifies over every tiling, and defines translation periods of
    the tile collection. It does not assert exact Chair44 identity, firstness, a 362-patch Lean theorem,
    polyhedral topology, or full isometry-group aperiodicity.
