version: v0.4
project:
  name: 'HENRY: A Strongly Aperiodic Monotile in Seven Dimensions'
  description: We give an explicit compact tile, called HENRY, in seven-dimensional Euclidean space. It
    modifies a chair made from 127 unit seven-cubes with 1,024 rational pyramidal keys. Copies may be
    translated, rotated or reflected. The selected theorem proves that the tile admits a tiling, every
    such physical tiling has no nonzero translational period, and its full Euclidean symmetry group is
    finite with at most 645,120 elements. No lattice-registration, matching-rule or hierarchy hypothesis
    is assumed. Here, strongly aperiodic means finite full Euclidean symmetry group; a trivial symmetry
    group is not asserted.
  authors:
  - Conor Grogan
  responsible_maintainers:
  - Conor Grogan
  license: Apache-2.0
classification:
  arxiv:
  - math.MG
  - math.CO
  msc2020: []
