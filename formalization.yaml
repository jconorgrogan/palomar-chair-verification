    evidence/uniform_prime directory, including THEOREM_SUMMARY.md SHA-256 76dae90716a32d4a84f3818ba919dd51f3a471bed7bd60cf1583e1e37d0139ad.
    This summary is identical to the source identified in accepted CLARK metadata. The companion package
