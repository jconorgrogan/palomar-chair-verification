# Approved descriptive naming revision; proof code and comparison configuration unchanged.
version: v0.4
project:
  name: 'The CLARK Tile: An Aperiodic Monotile in Five Dimensions'
  description: We give an explicit compact tile, called CLARK (Chair with Local Asymmetric Registration
    Keys), in five-dimensional Euclidean space and prove that it admits tilings but no periodic tiling.
    The construction modifies a chair made from 31 unit five-cubes with 256 rational pyramidal keys. Copies
    may be translated, rotated, or reflected. The theorem states that every tiling by these copies has
    no nonzero translation preserving its tile collection. The Lean formalization fixes the exact body
    and proves compactness, existence, and aperiodicity without assuming lattice registration or matching
    rules.
  authors:
  - Conor Grogan
  responsible_maintainers:
  - Conor Grogan
  license: Apache-2.0
