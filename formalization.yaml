version: v0.4
project:
  name: 'HENRY: A Strongly Aperiodic Monotile in Seven Dimensions'
  description: We give an explicit compact tile, called HENRY, in seven-dimensional Euclidean space. It
    modifies a chair made from 127 unit seven-cubes with 1,024 rational pyramidal keys. Copies may be
    translated, rotated or reflected. The selected theorem proves that the tile admits a tiling, every
    such physical tiling has no nonzero translational period, and its full Euclidean symmetry group is
    finite with at most 645,120 elements. No lattice-registration, matching-rule or hierarchy hypothesis
    is assumed. Here, strongly aperiodic means finite full Euclidean symmetry group; a trivial symmetry
    group is not asserted.
  authors:
  - Conor Grogan
  responsible_maintainers:
  - Conor Grogan
  license: Apache-2.0
classification:
  arxiv:
  - math.MG
  - math.CO
  msc2020: []
sources:
- title: Exact sparse-key seven-dimensional tile specification
  type: other
  relationship: formalizes
  note: 'The retained tile7_final_spec.json has SHA-256 2d8a6562eb1ee4f7ebeb0af571c783d92fb5c3296bc638848aad13ebcd2230a2.
    Its exact order, rational coordinates, bump/dent signs and all 1,024 keys must be retained. The specification
    records 127 carrier cells, 896 exposed facets, 512 bumps, 512 dents and key height 1/336. HENRY is
    the user-selected name for this exact T7 body. Original bibliographic authors and endorsement status
    have not been established; author_endorsement: other means unknown, not endorsed. The exact retained
    input is byte-identical to the author-controlled data in the companion-paper package covered by its
    approved LICENSE_SCOPE.md (6 October 2026): CC-BY-4.0 for author-controlled data, with existing third-party
    terms preserved. This identifies the scoped release terms, not previously unknown bibliographic authorship
    or endorsement.'
