version: v0.4
project:
  name: Aperiodic monotiles in every dimension at least two
  description: Source-stage construction of a dimension-dependent compact Euclidean tile with nonempty
    interior for every dimension at least two, admitting a tiling by arbitrary isometric images and admitting
    no tiling with a nonzero translation period. The uniform Lean assembly and official preflight are
    still pending; this draft does not assert an accepted all-dimension theorem.
  authors:
  - Conor Grogan
  responsible_maintainers:
  - Conor Grogan
  license: Apache-2.0
repository:
  role: substantive-development
sources:
- title: Aperiodic Monotiles in Every Dimension d ≥ 2, working manuscript v3, 17 October 2026
  authors:
  - Conor Grogan
  type: paper
  location: Physical statements on pages 2–3; dimension split and explicit parent-occurrence premise
  relationship: formalizes
  note: The manuscript itself marks the unconditional uniform theorem pending. The precise final paper/public
    reference and author attribution will be reviewed before submission.
- title: Monotiles in every dimension
